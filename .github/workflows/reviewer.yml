name: Reviewer

on:
  schedule:
    - cron: "30 0 * * *"  # 06:00 IST, sleeps up to 180min -> lands 6am-9am IST
  workflow_dispatch: {}

jobs:
  run:
    uses: anubhab-m02/automation-kit/.github/workflows/reviewer.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
